aid: flecto
name: Flecto
description: Flecto is a SaaS platform for rental businesses, providing tools to manage bookings, inventory,
  payments, and customer verification across both online and in-store channels. Backed by Techstars, the
  company offers "The Flecto Link" for flexible checkout, ID and face-scan verification, item protection
  and insurance, a hosted online store builder, and the Flecto Market marketplace. It supports payment
  methods including MB Way, PayPal, Mastercard, and Apple Pay. Flecto does not currently publish a public
  API or developer platform; this profile tracks its public web and business surface.
